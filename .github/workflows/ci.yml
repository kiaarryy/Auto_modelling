name: ci

on:
  push:
  pull_request:

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: auto-fmu scan-hygiene --root .
      - run: auto-fmu validate-config --config examples/generic_building_minimal/project.yaml
      - run: auto-fmu batch --config examples/generic_building_minimal/project.yaml --equipment all --run-id generic-smoke
