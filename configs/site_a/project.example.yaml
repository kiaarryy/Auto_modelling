        flow_csvs: ["${AUTO_FMU_SITE_A_ROOT}/chiller/CH_04.csv", "${AUTO_FMU_SITE_A_ROOT}/heat_exchanger/HX_02.csv"]
    - <<: *cooling_tower_defaults
      id: CT_05
      sources:
        tower_csv: "${AUTO_FMU_SITE_A_ROOT}/cooling_tower/CT_05.csv"
        wetbulb_csv: "${AUTO_FMU_SITE_A_ROOT}/WET_BALL/OUTDOOR/Local_IO.RF1-OUTDOOR_202405_202504_with_Twb.csv"
