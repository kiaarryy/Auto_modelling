      flow_family: CDW
      source_kind: HX
  chiller:
    - id: DCCP_01
      runner: chiller_external
      sources:
        steady_csv: "${AUTO_FMU_ARCHIVE_ROOT}/Cali_EIR_BSU_CH1/ChillerData/steady/CH_01_steady.csv"
      readiness:
        min_valid_rows: 30
      thresholds:
        CVRMSE_pct: 30.0
        NMBE_pct: 15.0
      candidates:
        - kind: ElectricEIR
          fmu_path: "${AUTO_FMU_ARCHIVE_ROOT}/Cali_EIR_BSU_CH1/Modelica/ChillerCalibration_FMU_chiller_0EIR3.fmu"
          curve_data: "${AUTO_FMU_ARCHIVE_ROOT}/Cali_EIR_BSU_CH1/ChillerData/ChillerData_v3.xlsx"
          row: 66
        - kind: ElectricReformulatedEIR
          fmu_path: "${AUTO_FMU_ARCHIVE_ROOT}/Cali_EIR_BSU_CH1/Modelica/ChillerCalibration_0EEIR_FMU_chiller_0EEIR.fmu"
          curve_data: "${AUTO_FMU_ARCHIVE_ROOT}/outputs/ChillerData_ElectricReformulatedEIR_v12_1_0.xlsx"
          row: 91
        - kind: Carnot_TEva
          fmu_path: "${AUTO_FMU_ARCHIVE_ROOT}/Cali_EIR_BSU_CH1/Modelica/ChillerCalibration_FMU_chiller_Carnot.fmu"
  cooling_tower:
    - <<: *cooling_tower_defaults
      id: CT_01
      sources:
        tower_csv: "${AUTO_FMU_SITE_A_ROOT}/cooling_tower/CT_01.csv"
        wetbulb_csv: "${AUTO_FMU_SITE_A_ROOT}/WET_BALL/OUTDOOR/Local_IO.RF1-OUTDOOR_202405_202504_with_Twb.csv"
        flow_csvs: ["${AUTO_FMU_SITE_A_ROOT}/chiller/CH_01.csv", "${AUTO_FMU_SITE_A_ROOT}/heat_exchanger/HX_01.csv"]
    - <<: *cooling_tower_defaults
      id: CT_02
      sources:
        tower_csv: "${AUTO_FMU_SITE_A_ROOT}/cooling_tower/CT_02.csv"
        wetbulb_csv: "${AUTO_FMU_SITE_A_ROOT}/WET_BALL/OUTDOOR/Local_IO.RF1-OUTDOOR_202405_202504_with_Twb.csv"
        flow_csvs: ["${AUTO_FMU_SITE_A_ROOT}/chiller/CH_02.csv"]
    - <<: *cooling_tower_defaults
      id: CT_03
      sources:
        tower_csv: "${AUTO_FMU_SITE_A_ROOT}/cooling_tower/CT_03.csv"
        wetbulb_csv: "${AUTO_FMU_SITE_A_ROOT}/WET_BALL/OUTDOOR/Local_IO.RF1-OUTDOOR_202405_202504_with_Twb.csv"
        flow_csvs: ["${AUTO_FMU_SITE_A_ROOT}/chiller/CH_03.csv"]
    - <<: *cooling_tower_defaults
