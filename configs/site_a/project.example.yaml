outputs_dir: ../../outputs
thresholds:
  CVRMSE_pct: 10.0
  NMBE_pct: 5.0

# Keep machine-specific paths in project.local.yaml or environment variables.
archive_root: ${AUTO_FMU_ARCHIVE_ROOT}
export_defaults:
  mode: disabled

pump_defaults: &pump_defaults
  runner: pump_empirical
  flow_scale: 0.997
  candidates: [affinity_y3, speed_poly, flow_speed_5term]
  window:
    rows: 288
    stride: 12
    count: 3
    min_separation: 288
    step_seconds: 300
  readiness:
    min_valid_rows: 288
    min_windows: 1
    hxcwp_min_flow_p95: 10.0
  export:
    mode: disabled

cooling_tower_defaults: &cooling_tower_defaults
  runner: cooling_tower_external
  readiness:
    min_valid_rows: 288
  thresholds:
    CVRMSE_pct: 20.0
    NMBE_pct: 10.0
  candidates:
    - model: Merkel
      fmu_path: "${AUTO_FMU_ARCHIVE_ROOT}/Cali_EIR_BSU_CH1/Modelica/CTM_0FMU.fmu"
      parameter_csv: "${AUTO_FMU_ARCHIVE_ROOT}/outputs/cooling_tower/auto_model_site_a/site_a_best_parameters_full_period_refined.csv"
    - model: YorkCalc
      fmu_path: "${AUTO_FMU_ARCHIVE_ROOT}/Cali_EIR_BSU_CH1/Modelica/CTY_0FMU.fmu"
      parameter_csv: "${AUTO_FMU_ARCHIVE_ROOT}/outputs/cooling_tower/auto_model_site_a/site_a_best_parameters_full_period_refined.csv"

heat_exchanger_defaults: &heat_exchanger_defaults
  runner: heat_exchanger_external
  readiness:
    min_valid_rows: 288
  validation:
    chunk_rows: 288
  thresholds:
    CVRMSE_pct: 15.0
    NMBE_pct: 10.0
  calibration:
    parameters_csv: "${AUTO_FMU_ARCHIVE_ROOT}/outputs/heat_exchanger/calibration/site_a_hx_model_best_parameters.csv"
  candidates:
    - model: ConstantEffectiveness
      fmu_path: "${AUTO_FMU_ARCHIVE_ROOT}/outputs/heat_exchanger/modelica_interface/fmu/SiteAHXConstantEffectiveness.fmu"
    - model: PlateEffectivenessNTU
      fmu_path: "${AUTO_FMU_ARCHIVE_ROOT}/outputs/heat_exchanger/modelica_interface/fmu/SiteAHXPlateEffectivenessNTU.fmu"

equipment:
  pump:
    - <<: *pump_defaults
      id: CHWP_01
      sources: {pump_csv: "${AUTO_FMU_SITE_A_ROOT}/building1/CHWP_01.csv", flow_csv: "${AUTO_FMU_SITE_A_ROOT}/building1/CH_01.csv"}
      flow_family: CHW
      source_kind: CH
    - <<: *pump_defaults
      id: CDWP_01
      sources: {pump_csv: "${AUTO_FMU_SITE_A_ROOT}/building1/CDWP_01.csv", flow_csv: "${AUTO_FMU_SITE_A_ROOT}/building1/CH_01.csv"}
      flow_family: CDW
      source_kind: CH
    - <<: *pump_defaults
      id: CHWP_02
      sources: {pump_csv: "${AUTO_FMU_SITE_A_ROOT}/building1/CHWP_02.csv", flow_csv: "${AUTO_FMU_SITE_A_ROOT}/building1/CH_02.csv"}
      flow_family: CHW
      source_kind: CH
    - <<: *pump_defaults
      id: CDWP_02
      sources: {pump_csv: "${AUTO_FMU_SITE_A_ROOT}/building1/CDWP_02.csv", flow_csv: "${AUTO_FMU_SITE_A_ROOT}/building1/CH_02.csv"}
      flow_family: CDW
      source_kind: CH
    - <<: *pump_defaults
      id: CHWP_03
      sources: {pump_csv: "${AUTO_FMU_SITE_A_ROOT}/building1/CHWP_03.csv", flow_csv: "${AUTO_FMU_SITE_A_ROOT}/building1/CH_03.csv"}
      flow_family: CHW
      source_kind: CH
    - <<: *pump_defaults
