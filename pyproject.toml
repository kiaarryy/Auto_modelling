[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-fmu"
version = "0.1.0"
description = "Reusable four-equipment FMU auto-modelling pipeline"
requires-python = ">=3.8"
dependencies = [
  "fmpy>=0.3.21",
  "numpy>=1.20",
  "openpyxl>=3.0",
  "pandas>=1.3",
  "PyYAML>=5.4",
]

[project.scripts]
auto-fmu = "auto_fmu.cli:entrypoint"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
